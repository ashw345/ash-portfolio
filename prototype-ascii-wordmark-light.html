<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Wordmark — 交互原型</title>
  <style>
    :root { --bg: #f5f5f5; --fg: #0a0a0a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--bg); color: var(--fg); min-height: 100%; }
    body {
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
      padding: 0 clamp(20px, 6vw, 96px) 64px;
    }
    .hint {
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.35);
      margin-bottom: 24px;
    }
    .wordmark-canvas {
      display: block;
      width: 100%;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <div class="hint">把鼠标移到下面的字上 · move your cursor over the text</div>
  <canvas id="wordmark" class="wordmark-canvas" data-text="Ash.W"></canvas>

  <script>
  (function () {
    'use strict';

    const canvas = document.getElementById('wordmark');
    const ctx = canvas.getContext('2d');
    const TEXT = canvas.dataset.text || 'ASH';
    const TAU = Math.PI * 2;

    // 离散字点阶梯（对应 op.al 的 · ◦ • ● 四级）——靠「形状/覆盖率」区分明暗，而非透明度
    // 半径均为格子尺寸的比例
    const DOT = {
      rest:  { r: 0.09, fill: 'rgba(107,107,107,0.62)' },           // 白底翻转：背景点（148→107）
      ring:  { r: 0.26, stroke: 'rgba(160,160,160,0.7)', lw: 0.05 },// 白底翻转：空心圆描边（95→160）
      mid:   { r: 0.11, fill: 'rgba(105,105,105,0.9)' },            // 白底翻转：二级点（150→105）
      solid: { r: 0.23, fill: 'rgba(95,95,95,1)' }                  // 白底翻转：一级圆（160→95）
    };

    const dpr = window.devicePixelRatio || 1;

    // 网格 & 采样
    let cell = 16;
    const grid = { cols: 0, rows: 0, ox: 0, oy: 0 };
    let points = [];                      // [{c, r}]
    const state = new Map();              // "c,r" -> {influence}

    // 指针动力学
    const ptr = { x: -1e6, y: -1e6, active: false };
    const smooth = { x: 0, y: 0, init: false };
    const vel = { x: 0, y: 0 };
    let lastMoveT = 0;

    // 掉落方块
    let blocks = [];
    let lastSpawn = 0;

    // 离屏画布：用来把文字采样成网格点
    const off = document.createElement('canvas');
    const offCtx = off.getContext('2d', { willReadFrequently: true });

    function buildPoints() {
      // 用布局尺寸（不受 CSS transform 影响，避免缩放时反馈放大）
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (!w || !h) return;

      cell = Math.max(3, Math.round(h * 0.0072));   // 更密的点阵（格子更小）

      off.width = Math.max(1, Math.ceil(w));
      off.height = Math.max(1, Math.ceil(h));
      offCtx.fillStyle = '#000';
      offCtx.fillRect(0, 0, off.width, off.height);

      // 画一个撑满宽度的粗体字
      offCtx.fillStyle = '#fff';
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      let fontSize = h * 1.05;
      offCtx.font = `800 ${fontSize}px "Helvetica Neue", Arial, sans-serif`;
      // 收缩字号让文字宽度贴合画布
      let measured = offCtx.measureText(TEXT).width;
      const targetW = w * 0.96;
      if (measured > 0) {
        fontSize = fontSize * (targetW / measured);
        offCtx.font = `800 ${fontSize}px "Helvetica Neue", Arial, sans-serif`;
      }
      offCtx.fillText(TEXT, w / 2, h / 2 + fontSize * 0.02);

      const data = offCtx.getImageData(0, 0, off.width, off.height).data;
      const cols = Math.floor(off.width / cell);
      const rows = Math.floor(off.height / cell);
      const pts = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const px = Math.floor((c + 0.5) * cell);
          const py = Math.floor((r + 0.5) * cell);
          const idx = (py * off.width + px) * 4;
          if (data[idx] > 80) pts.push({ c, r });
        }
      }
      const gw = cols * cell, gh = rows * cell;
      grid.cols = cols;
      grid.rows = rows;
      grid.ox = (w - gw) / 2;
      grid.oy = (h - gh) / 2;
      points = pts;
      state.clear();
    }

    function resize() {
      // clientWidth 为布局宽度，不受 CSS transform 影响（避免缩放反馈把画布越撑越大）
      const w = canvas.clientWidth;
      if (!w) return;
      // 高度按字形比例给一个固定纵横比（宽:高 ≈ 3.2 : 1，可调）
      const targetH = w / 3.2;
      canvas.style.height = targetH + 'px';
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(targetH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildPoints();
    }

    // 鼠标：记录位置 + 计算速度（EMA 平滑）
    function onMove(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const now = performance.now();
      if (ptr.active && lastMoveT > 0) {
        const dt = Math.max(0.001, (now - lastMoveT) / 1000);
        const vx = (x - ptr.x) / dt;
        const vy = (y - ptr.y) / dt;
        vel.x = 0.82 * vel.x + 0.18 * vx;
        vel.y = 0.82 * vel.y + 0.18 * vy;
      }
      if (!(ptr.active && smooth.init)) {
        smooth.x = x; smooth.y = y; smooth.init = true;
      }
      lastMoveT = now;
      ptr.x = x; ptr.y = y; ptr.active = true;
    }
    function onLeave() { ptr.active = false; }

    // 各多边形对应的边数（0 = 圆）
    const POLY_SIDES = { triangle: 3, pentagon: 5, hexagon: 6, circle: 0 };

    function spawnBlocks(tSec, rectW) {
      if (tSec - lastSpawn > 5) {          // 掉落频率略高一点
        lastSpawn = tSec;
        const types = ['square', 'rect', 'circle', 'triangle', 'pentagon', 'hexagon'];
        const type = types[Math.floor(Math.random() * types.length)];
        const sides = POLY_SIDES.hasOwnProperty(type) ? POLY_SIDES[type] : -1; // -1 = 矩形/方形
        const base = 22 * cell;            // 落体更大
        const scale = 0.7 + 0.9 * Math.random();   // 尺寸差异更大（有大有小）
        let bw, bh;
        if (type === 'rect') {
          const ratio = 1.4 + 1.1 * Math.random();  // 长宽比 1.4–2.5
          if (Math.random() < 0.5) { bw = base * scale; bh = bw * ratio; }   // 竖高
          else { bh = base * scale; bw = bh * ratio; }                        // 宽扁
        } else { bw = bh = base * scale; }
        const bx = Math.random() * Math.max(1, rectW - bw);
        const diag = Math.sqrt(bw * bw + bh * bh) / 2;
        const by = grid.oy - 12 - bh / 2 - diag;
        blocks.push({
          type, sides, x: bx, y: by, w: bw, h: bh,
          speed: 50 + 40 * Math.random(),
          angle: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 1.2,
          cosA: 1, sinA: 0
        });
      }
    }

    function pointInBlock(b, px, py) {
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      const dx = px - cx, dy = py - cy;
      const lx = dx * b.cosA - dy * b.sinA;
      const ly = dx * b.sinA + dy * b.cosA;
      const hw = b.w / 2, hh = b.h / 2;
      if (b.type === 'square' || b.type === 'rect') return Math.abs(lx) <= hw && Math.abs(ly) <= hh;
      if (b.type === 'circle') { const rr = Math.min(hw, hh); return lx * lx + ly * ly <= rr * rr; }
      // 正多边形：外接圆半径 R，按极角判断是否在边界内
      const R = Math.min(hw, hh);
      const dist = Math.hypot(lx, ly);
      if (dist > R) return false;
      const seg = (2 * Math.PI) / b.sides;
      const a = ((Math.atan2(ly, lx) % seg) + seg) % seg;
      const edgeDist = R * Math.cos(Math.PI / b.sides) / Math.cos(a - Math.PI / b.sides);
      return dist <= edgeDist;
    }

    let raf = 0, prevT = null;
    function frame(t) {
      const dt = prevT == null ? 0 : Math.min(0.1, (t - prevT) / 1000);
      prevT = t;
      const rect = canvas.getBoundingClientRect();

      // 掉落方块推进
      spawnBlocks(t / 1000, rect.width);
      for (const b of blocks) {
        b.y += b.speed * dt;
        b.angle += b.rotSpeed * dt;
        b.cosA = Math.cos(-b.angle);
        b.sinA = Math.sin(-b.angle);
      }
      blocks = blocks.filter(b => b.y < rect.height + b.h);

      // 速度衰减（鼠标停下时）
      const sinceMove = lastMoveT > 0 ? (t - lastMoveT) / 1000 : 999;
      if (!ptr.active || sinceMove > 0.04) {
        const decay = Math.exp(-3 * dt);
        vel.x *= decay; vel.y *= decay;
      }
      // 平滑指针追随
      if (ptr.active && smooth.init) {
        const e = 1 - Math.exp(-7 * dt);
        smooth.x += (ptr.x - smooth.x) * e;
        smooth.y += (ptr.y - smooth.y) * e;
      }

      ctx.clearRect(0, 0, rect.width, rect.height);

      const speed = Math.hypot(vel.x, vel.y);
      const b = Math.min(10, 3 + 0.012 * speed) * cell;   // 速度越快，影响半径越大
      const denom = 2 * b * b;
      const cutoff = (3 * b) * (3 * b);
      const decayPerFrame = dt / 3.2;

      for (const { c, r } of points) {
        const px = grid.ox + (c + 0.5) * cell;
        const py = grid.oy + (r + 0.5) * cell;
        const key = c + ',' + r;
        let st = state.get(key);
        if (!st) { st = { influence: 0 }; state.set(key, st); }

        st.influence = Math.max(0, st.influence - decayPerFrame);

        if (ptr.active && smooth.init) {
          const dx = px - smooth.x, dy = py - smooth.y;
          const d2 = dx * dx + dy * dy;
          if (d2 <= cutoff) {
            const inf = Math.exp(-d2 / denom);
            if (inf > st.influence) st.influence = inf;
          }
        }
        // 掉落方块覆盖 -> 点亮
        for (const bl of blocks) {
          if (pointInBlock(bl, px, py)) { st.influence = 1; break; }
        }

        // 离散四级：靠形状区分，而非透明度渐变（对齐 op.al 的 · ◦ • ● 逻辑）
        const v = st.influence;
        if (v >= 0.7) {          // 一级：灰实心圆
          ctx.fillStyle = DOT.solid.fill;
          ctx.beginPath(); ctx.arc(px, py, Math.max(0.85, DOT.solid.r * cell), 0, TAU); ctx.fill();
        } else if (v >= 0.35) {  // 二级：灰实心点
          ctx.fillStyle = DOT.mid.fill;
          ctx.beginPath(); ctx.arc(px, py, Math.max(0.6, DOT.mid.r * cell), 0, TAU); ctx.fill();
        } else if (v >= 0.12) {  // 三级：灰色描边空心圆
          ctx.strokeStyle = DOT.ring.stroke;
          ctx.lineWidth = Math.max(0.4, DOT.ring.lw * cell);
          ctx.beginPath(); ctx.arc(px, py, Math.max(0.7, DOT.ring.r * cell), 0, TAU); ctx.stroke();
        } else {                 // 静息：背景点
          ctx.fillStyle = DOT.rest.fill;
          ctx.beginPath(); ctx.arc(px, py, Math.max(0.55, DOT.rest.r * cell), 0, TAU); ctx.fill();
        }
      }

      raf = requestAnimationFrame(frame);
    }

    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseleave', onLeave);
    window.addEventListener('resize', resize);
    // 用 ResizeObserver 兜底：只要画布尺寸变化就重建点阵（与 op.al 一致，避免初次布局尺寸不准）
    if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(canvas);

    resize();
    raf = requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
